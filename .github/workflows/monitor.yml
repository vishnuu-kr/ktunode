name: KTU Monitor
on:
  schedule:
    - cron: '0 0,12 * * *' # Automatically runs twice a day
  workflow_dispatch: # Lets you trigger it manually

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Dependencies
        run: pip install requests beautifulsoup4
        
      - name: Run Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_ktu.py
        
      - name: Save State
        run: |
          if [ -f last_link.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last_link.txt
            git commit -m "Update last seen link [skip ci]" || echo "No changes to save"
            git push origin main
          else
            echo "Tracking file not generated yet. Skipping Git commit."
          fi