name: KTU Monitor
on:
  schedule:
    - cron: '0 0,12 * * *' # Automatically runs twice a day (Midnight and Noon)
  workflow_dispatch: # Lets you run it manually whenever you want

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to save progress back to your repo
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Dependencies
        run: pip install requests beautifulsoup4
        
      - name: Run Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_ktu.py
        
      - name: Save State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_link.txt
          git commit -m "Update last seen link [skip ci]" || echo "No changes to save"
          git push