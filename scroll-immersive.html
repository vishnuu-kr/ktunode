<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Immersive Typography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ec;
      --text: #0a0a0a;
      --text-muted: rgba(10,10,10,0.35);
      --accent: #4361ee;
    }
    body, html {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Background Layers */
    .bg-vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at center, #faf7f2 0%, #ede8e0 100%);
    }

    .bg-noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: 0.04;
    }

    /* Ambient Particles */
    #ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    /* Scroll Container */
    .scroll-container {
      position: relative;
      min-height: 400vh;
    }

    .sticky-wrapper {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 10;
    }

    /* Depth Layer Ghost */
    .ghost-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-1.5deg);
      font-weight: 700;
      font-size: clamp(192px, 30vw, 420px);
      line-height: 0.88;
      letter-spacing: -2px;
      color: rgba(10,10,10,0.025);
      white-space: nowrap;
      z-index: -1;
      pointer-events: none;
    }

    /* Typography Lines */
    .line-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
    }

    .line {
      font-weight: 700;
      font-size: clamp(64px, 10vw, 140px);
      line-height: 0.88;
      letter-spacing: -2px;
      opacity: 0; /* JS will handle */
      margin-bottom: 2vh;
    }

    .line-1 {
      text-align: left;
      padding-left: 8vw;
    }

    .line-2 {
      text-align: right;
      padding-right: 8vw;
      font-size: clamp(80px, 13vw, 180px);
    }

    .sub-caption {
      font-weight: 300;
      font-size: clamp(14px, 1.8vw, 22px);
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-align: left;
      padding-left: 8vw;
      margin-top: -1vh;
      margin-bottom: 4vh;
      opacity: 0;
    }

    .line-3 {
      text-align: left;
      padding-left: 14vw;
    }

    .line-4 {
      text-align: center;
      position: relative;
    }

    .accent {
      color: rgba(67,97,238,0.3); /* Default starts faded */
      display: inline-block;
      transform-origin: center bottom;
    }

    /* Final Line Rule */
    .final-rule {
      height: 1px;
      background: var(--accent);
      margin: 24px auto 0;
      width: 0;
      opacity: 0;
      transition: width 0.8s ease, opacity 0.8s ease;
    }
  </style>
</head>
<body>

  <!-- Background Layers -->
  <div class="bg-vignette"></div>
  <svg class="bg-noise" xmlns="http://www.w3.org/2000/svg">
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#noise)"></rect>
  </svg>
  
  <canvas id="ambient-canvas"></canvas>

  <div class="scroll-container" id="scroll-section">
    <div class="sticky-wrapper">
      
      <!-- Depth Layer Ghost (Last line) -->
      <div class="ghost-layer">every exam.</div>

      <div class="line-container">
        <!-- Line 1: 0.00-0.15 -->
        <div class="line line-1" id="l1">Notes. PYQs.</div>
        
        <!-- Line 2: 0.15-0.35 -->
        <div class="line line-2" id="l2">Everything</div>
        
        <!-- Sub-caption: between 2 and 3 (0.25-0.45) -->
        <div class="sub-caption" id="l-sub">YOU NEED TO MASTER THE SEMESTER</div>

        <!-- Line 3: 0.35-0.55 -->
        <div class="line line-3" id="l3">to <span class="accent" id="accent-word">succeed</span> in</div>
        
        <!-- Line 4: 0.55-0.75 -->
        <div class="line line-4" id="l4">
          every exam.
          <div class="final-rule" id="final-rule"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 1. Particle System
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = Array.from({ length: 25 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.5 + 1,
      vy: -(Math.random() * 0.12 + 0.08),
      vxBase: Math.random() * Math.PI * 2, // phase
      vxSpeed: Math.random() * 0.02 + 0.01,
      opacity: Math.random() * 0.12 + 0.06
    }));

    function drawParticles() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        // Move
        p.y += p.vy;
        p.vxBase += p.vxSpeed;
        p.x += Math.sin(p.vxBase) * 0.3;

        // Reset if off top
        if (p.y < -10) {
          p.y = height + 10;
          p.x = Math.random() * width;
        }

        ctx.fillStyle = `rgba(10,10,10,${p.opacity})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // 2. Scroll Mechanic
    const scrollSection = document.getElementById('scroll-section');
    const el1 = document.getElementById('l1');
    const el2 = document.getElementById('l2');
    const elSub = document.getElementById('l-sub');
    const el3 = document.getElementById('l3');
    const el4 = document.getElementById('l4');
    const accent = document.getElementById('accent-word');
    const rule = document.getElementById('final-rule');

    function calculateProgress(scrollRatio, start, end) {
      if (scrollRatio <= start) return 0;
      if (scrollRatio >= end) return 1;
      return (scrollRatio - start) / (end - start);
    }

    function lerp(start, end, amt) {
      return (1 - amt) * start + amt * end;
    }

    function updateScroll() {
      const sectionTop = scrollSection.offsetTop;
      let scrollY = window.scrollY - sectionTop;
      const maxScroll = scrollSection.offsetHeight - window.innerHeight;
      
      let p = scrollY / maxScroll;
      p = Math.max(0, Math.min(1, p));

      // Line 1: 0.00 - 0.15 (Left align, drifts right)
      const p1 = calculateProgress(p, 0.00, 0.15);
      el1.style.opacity = p1;
      el1.style.transform = `translateY(${lerp(40, 0, p1)}px) translateX(${lerp(-20, 0, p)}px)`;

      // Line 2: 0.15 - 0.35 (Right align, drifts left)
      const p2 = calculateProgress(p, 0.15, 0.35);
      el2.style.opacity = p2;
      el2.style.transform = `translateY(${lerp(40, 0, p2)}px) translateX(${lerp(20, 0, p)}px)`;

      // Sub-caption: 0.25 - 0.45 (Left align, drifts right)
      const pSub = calculateProgress(p, 0.25, 0.45);
      elSub.style.opacity = pSub;
      elSub.style.transform = `translateY(${lerp(20, 0, pSub)}px) translateX(${lerp(-10, 0, p)}px)`;

      // Line 3: 0.35 - 0.55 (Left align, drifts right)
      const p3 = calculateProgress(p, 0.35, 0.55);
      el3.style.opacity = p3;
      el3.style.transform = `translateY(${lerp(40, 0, p3)}px) translateX(${lerp(-20, 0, p)}px)`;

      // Accent Word: syncs with Line 3 reveal (p3)
      const scale = lerp(0.85, 1, p3);
      const alpha = lerp(0.3, 1, p3);
      accent.style.transform = `scale(${scale})`;
      accent.style.color = `rgba(67,97,238,${alpha})`;

      // Line 4: 0.55 - 0.75 (Center align, no drift)
      const p4 = calculateProgress(p, 0.55, 0.75);
      el4.style.opacity = p4;
      el4.style.transform = `translateY(${lerp(40, 0, p4)}px)`;

      // Final Rule: > 0.80
      if (p > 0.8) {
        rule.style.width = '120px';
        rule.style.opacity = '1';
      } else {
        rule.style.width = '0px';
        rule.style.opacity = '0';
      }
    }

    window.addEventListener('scroll', updateScroll, { passive: true });
    window.addEventListener('resize', updateScroll);
    updateScroll(); // init
  </script>
</body>
</html>
